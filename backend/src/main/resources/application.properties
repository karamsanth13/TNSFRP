spring.application.name=tnsfrp
server.port=${PORT:8080}

# MongoDB (override with the MONGODB_URI environment variable)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tnsfrp}
spring.data.mongodb.auto-index-creation=true

# Frontend origin allowed by CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Development admin: created at startup ONLY if both email and password are set
app.admin.name=${ADMIN_NAME:System Admin}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m
